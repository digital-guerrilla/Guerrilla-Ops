name: Validate, Build and Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - dev
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check whitespace and conflict markers
        run: |
          git show --format= --check HEAD
          if git grep -n -I -E '^(<<<<<<< |=======$|>>>>>>> )' -- dev .github README.md; then
            echo "::error::Unresolved merge markers found"
            exit 1
          else
            status=$?
            [ "$status" -eq 1 ] || exit "$status"
          fi

      - name: Validate Python syntax
        run: python -m compileall -q dev/setup_dev.py dev/build

      - name: Test release versioning
        run: node --test .github/tests/next-release.test.cjs

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -pyflakes= .github/workflows/*.yml

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Audit locked Node dependencies
        run: npm audit --audit-level=high
        working-directory: dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependency auditor
        run: python -m pip install pip-audit==2.9.0

      - name: Audit pinned Python build dependencies
        run: python -m pip_audit -r dev/requirements-build.txt --strict

  security:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths:
              - dev
              - .github/scripts
            paths-ignore:
              - dev/packages/cache
              - dev/node_modules

      - name: Analyze source security
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results
          category: /language:${{ matrix.language }}
          upload-database: false

      - name: Fail on security findings
        run: |
          if ! jq -s -e '[.[].runs[].results[]?] | length == 0' codeql-results/*.sarif; then
            echo "::error::CodeQL reported security findings or invalid results; see the Security tab and analysis logs"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: [validation, dependencies, security]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: dev/package-lock.json

      - name: Install Node dependencies
        run: npm ci
        working-directory: dev

      - name: Install build dependencies
        run: python -m pip install -r dev/requirements-build.txt

      - name: Run release script
        run: python dev/build/build_release.py

      - name: Run regression tests
        run: npm test
        working-directory: dev

      - name: Audit bundled browser dependencies
        run: npx --yes --package=retire@6.1.0 retire --path dev/packages/cache --severity high --exitwith 1

      - name: Stage Pages artifact
        if: github.event_name != 'pull_request'
        run: mkdir -p _site && cp index.html _site/index.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload release binaries
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-html
          path: |
            release/Guerrilla-Ops.html
            release/Guerrilla-Ops-Airgapped.html
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Compute next version tag
        id: version
        run: |
          set -euo pipefail
          next=$(node .github/scripts/next-release.cjs)
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          name: release-html
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/Guerrilla-Ops.html
            release-assets/Guerrilla-Ops-Airgapped.html

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
